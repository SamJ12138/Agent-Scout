name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . -r requirements-dev.txt
      # The suite starts its own servers on 127.0.0.1 and makes no request to
      # the internet. Tests that need a browser are skipped here: Chromium is
      # not installed on the runner.
      - name: Test
        run: python -m pytest
