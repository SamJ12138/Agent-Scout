name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        # the lowest supported version (requires-python in pyproject.toml) and
        # the newest one the suite has been run on
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . -r requirements-dev.txt
      # The browser tests of report.html run on Linux, where a missing browser
      # is a failure. On Windows no browser is installed and those tests are
      # skipped with a message saying so.
      - name: Install Chromium for the browser tests
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      # The suite starts its own servers on 127.0.0.1 and makes no request to
      # the internet.
      - name: Test
        env:
          AGENT_SCOUT_REQUIRE_BROWSER: ${{ runner.os == 'Linux' && '1' || '' }}
        run: python -m pytest -rs
