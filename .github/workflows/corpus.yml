name: corpus

# Runs the tool on the real websites listed in docs/real-corpus/sites.yaml,
# scores the result against docs/real-corpus/ground-truth/ and commits the
# three output files back to main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/real-corpus/sites.yaml"
      - "docs/real-corpus/ground-truth/**"

permissions:
  contents: write

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      # Exit code 0 whatever the sites answer: a blocked or unreachable site
      # is recorded in scores.md. Non-zero only if the tool itself fails.
      - name: Run the tool on the corpus and score it
        run: python scripts/run_corpus.py --keep-run-dir corpus-run
      - name: Keep the full run output (reports and run log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-run
          path: corpus-run/
          if-no-files-found: ignore
      - name: Commit the outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/real-corpus/results/latest.json docs/real-corpus/scores.md docs/real-corpus/report.html
          if git diff --cached --quiet; then
            echo "Outputs unchanged."
          else
            git commit -m "docs: real-corpus results from workflow run ${{ github.run_number }} [skip ci]"
            git push || (git pull --rebase origin main && git push)
          fi
